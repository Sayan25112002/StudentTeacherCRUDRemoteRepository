<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #243047;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #263b80;
        }

        .card {
            background: white;
            padding: 24px;
            margin: 24px 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd2df;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            margin: 4px;
        }

        .primary {
            background: #3156c9;
        }

        .secondary {
            background: #667085;
        }

        .edit {
            background: #d99016;
        }

        .delete {
            background: #d63838;
        }

        .actions {
            margin-top: 18px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            white-space: nowrap;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e3e7ef;
            text-align: left;
        }

        th {
            background: #263b80;
            color: white;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .sort-button {
            background: transparent;
            color: white;
            font-weight: bold;
            font-size: inherit;
            font-family: inherit;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }

        .sort-button:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Student Management System</h1>

    <section class="card">
        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">
            <div class="form-grid">
                <div>
                    <label for="photo">Student Photo</label>
                    <input type="file" id="photo" accept="image/*" required>

                    <img id="photoPreview"
                         alt="Current Student Photo"
                         width="100"
                         height="100"
                         style="display: none; object-fit: cover; margin-top: 10px;">
                </div>

                <div>
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required>
                </div>

                <div>
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div>
                    <label for="contactNo">Contact Number</label>
                    <input type="tel" id="contactNo" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <div>
                    <label for="address">Address</label>
                    <textarea id="address" rows="3" required></textarea>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="primary" id="saveButton">
                    Create Student
                </button>

                <button type="button" class="secondary" id="cancelButton" hidden>
                    Cancel Edit
                </button>
            </div>
        </form>

        <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
        <h2>Student Records</h2>

        <button type="button" class="primary" id="refreshButton">
            Refresh Records
        </button>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th><button type="button" class="sort-button" data-sort="serial">Serial ID ↕</button></th>
                    <th>Photo</th>
                    <th><button type="button" class="sort-button" data-sort="firstName">First Name ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="lastName">Last Name ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="email">Email ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="contactNo">Contact Number ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="address">Address ↕</button></th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="studentTable"></tbody>
            </table>
        </div>
    </section>

</div>

<script>
    const API = {
        create: "http://localhost:8080/createStudent",
        read: "http://localhost:8080/readStudent",
        update: id => `http://localhost:8080/updateStudent?id=${id}`,
        delete: id => `http://localhost:8080/deleteStudent?id=${id}`
    };

    const form = document.getElementById("studentForm");
    const table = document.getElementById("studentTable");
    const message = document.getElementById("message");

    let editingId = null;
    let editingPhotoPath = null;
    let students = [];
    let sortColumn = "id";
    let sortDirection = "asc";

    async function request(url, options = {}) {
        const response = await fetch(url, options);

        if (!response.ok) {
            const details = await response.text();
            throw new Error(details || `Request failed: ${response.status}`);
        }

        if (response.status === 204) {
            return null;
        }

        const contentType = response.headers.get("content-type") || "";

        return contentType.includes("application/json")
            ? response.json()
            : null;
    }

    function showMessage(text) {
        message.textContent = text;
    }

    function getFormData() {
        return {
            firstName: document.getElementById("firstName").value.trim(),
            lastName: document.getElementById("lastName").value.trim(),
            email: document.getElementById("email").value.trim(),
            contactNo: document.getElementById("contactNo").value.trim(),
            password: document.getElementById("password").value,
            address: document.getElementById("address").value.trim()
        };
    }

    // Show a preview as soon as the user selects a photo.
    document.getElementById("photo").addEventListener("change", function () {
        const photoPreview = document.getElementById("photoPreview");
        const photo = this.files[0];

        if (photo) {
            photoPreview.src = URL.createObjectURL(photo);
            photoPreview.style.display = "block";
        } else {
            photoPreview.removeAttribute("src");
            photoPreview.style.display = "none";
        }
    });

    async function loadStudents() {
        try {
            const data = await request(API.read);

            if (!Array.isArray(data)) {
                throw new Error("Expected a list of students from the API.");
            }

            students = data;
            renderStudents();
        } catch (error) {
            showMessage("Could not load students: " + error.message);
        }
    }

    function updateSortArrows() {
        document.querySelectorAll(".sort-button").forEach(button => {
            const column = button.dataset.sort;
            const columnName = button.textContent.replace(/[↑↓↕]/g, "").trim();

            button.textContent = columnName +
                (column === sortColumn
                    ? (sortDirection === "asc" ? " ↑" : " ↓")
                    : " ↕");
        });
    }

    function renderStudents() {
        table.replaceChildren();

        const sortedStudents = [...students];

        sortedStudents.sort((a, b) => {
            let result;

            if (sortColumn === "serial") {
                result = students.indexOf(a) - students.indexOf(b);
            } else {
                const valueA = a[sortColumn] ?? "";
                const valueB = b[sortColumn] ?? "";

                result = String(valueA).localeCompare(
                    String(valueB),
                    undefined,
                    { numeric: true, sensitivity: "base" }
                );
            }

            return sortDirection === "asc" ? result : -result;
        });

        if (students.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 8;
            cell.textContent = "No student records found.";
            row.appendChild(cell);
            table.appendChild(row);

            updateSortArrows();
            return;
        }

        sortedStudents.forEach((student, index) => {
            const row = document.createElement("tr");

            const idCell = document.createElement("td");
            idCell.textContent = students.indexOf(student) + 1;
            row.appendChild(idCell);

            const photoCell = document.createElement("td");

            if (student.photoPath) {
                const fileName = student.photoPath.split(/[\\/]/).pop();

                const img = document.createElement("img");
                img.src = `http://localhost:8080/images/${encodeURIComponent(fileName)}`;
                img.alt = "Student Photo";
                img.width = 60;
                img.height = 60;
                img.style.objectFit = "cover";
                img.style.borderRadius = "6px";

                photoCell.appendChild(img);
            } else {
                photoCell.textContent = "No photo";
            }

            row.appendChild(photoCell);

            [
                student.firstName,
                student.lastName,
                student.email,
                student.contactNo,
                student.address
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            const actions = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.className = "edit";
            editButton.addEventListener("click", () => editStudent(student.id));

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";
            deleteButton.addEventListener("click", () => deleteStudent(student.id));

            actions.append(editButton, deleteButton);
            row.appendChild(actions);
            table.appendChild(row);
        });

        updateSortArrows();
    }

    // Re-fetches the existing image so it can be re-sent when no new photo is chosen.
    async function getExistingPhotoFile(photoPath) {
        const fileName = photoPath.split(/[\\/]/).pop();
        const response = await fetch(
            `http://localhost:8080/images/${encodeURIComponent(fileName)}`
        );

        if (!response.ok) {
            throw new Error("Could not load the existing photo.");
        }

        const blob = await response.blob();
        return new File([blob], fileName, { type: blob.type || "image/jpeg" });
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();

        const student = getFormData();
        const photo = document.getElementById("photo").files[0];
        const isEditing = editingId !== null;

        const formData = new FormData();

        Object.entries(student).forEach(([key, value]) => {
            // Password is sent only when creating a student.
            if (key === "password" && isEditing) {
                return;
            }
            formData.append(key, value);
        });

        try {
            if (photo) {
                formData.append("photo", photo);
            } else if (isEditing && editingPhotoPath) {
                // No new photo chosen: re-send the current one so the path is kept.
                formData.append("photo", await getExistingPhotoFile(editingPhotoPath));
                formData.append("photoPath", editingPhotoPath);
            }

            await request(
                isEditing ? API.update(editingId) : API.create,
                {
                    method: isEditing ? "PUT" : "POST",
                    body: formData
                }
            );

            resetForm();
            await loadStudents();

            showMessage(isEditing
                ? "Student updated successfully."
                : "Student created successfully.");
        } catch (error) {
            showMessage("Operation failed: " + error.message);
        }
    });

    function editStudent(id) {
        const student = students.find(item => item.id === id);

        if (!student) {
            showMessage("Student record not found.");
            return;
        }

        editingId = id;
        editingPhotoPath = student.photoPath ?? null;

        document.getElementById("photo").value = "";

        const photoPreview = document.getElementById("photoPreview");

        if (student.photoPath) {
            const fileName = student.photoPath.split(/[\\/]/).pop();
            photoPreview.src =
                `http://localhost:8080/images/${encodeURIComponent(fileName)}`;
            photoPreview.style.display = "block";
        } else {
            photoPreview.removeAttribute("src");
            photoPreview.style.display = "none";
        }

        document.getElementById("firstName").value = student.firstName ?? "";
        document.getElementById("lastName").value = student.lastName ?? "";
        document.getElementById("email").value = student.email ?? "";
        document.getElementById("contactNo").value = student.contactNo ?? "";
        document.getElementById("password").value = "";
        document.getElementById("address").value = student.address ?? "";

        // Password is not shown or submitted while editing.
        document.getElementById("password").required = false;
        document.getElementById("password").parentElement.style.display = "none";

        // Photo is optional while editing: the existing one is re-sent automatically.
        document.getElementById("photo").required = false;
        document.getElementById("formTitle").textContent = "Update Student";
        document.getElementById("saveButton").textContent = "Update Student";
        document.getElementById("cancelButton").hidden = false;

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteStudent(id) {
        if (!confirm("Are you sure you want to delete this student?")) {
            return;
        }

        try {
            await request(API.delete(id), { method: "DELETE" });

            if (editingId === id) {
                resetForm();
            }

            await loadStudents();
            showMessage("Student deleted successfully.");
        } catch (error) {
            showMessage("Delete failed: " + error.message);
        }
    }

    function resetForm() {
        form.reset();
        editingId = null;
        editingPhotoPath = null;

        document.getElementById("password").required = true;
        document.getElementById("password").parentElement.style.display = "";
        document.getElementById("photo").required = true;
        document.getElementById("formTitle").textContent = "Add Student";
        document.getElementById("saveButton").textContent = "Create Student";
        document.getElementById("cancelButton").hidden = true;
        document.getElementById("photo").value = "";

        const photoPreview = document.getElementById("photoPreview");
        photoPreview.removeAttribute("src");
        photoPreview.style.display = "none";
    }

    document.getElementById("cancelButton")
        .addEventListener("click", resetForm);

    document.getElementById("refreshButton")
        .addEventListener("click", loadStudents);

    document.querySelectorAll(".sort-button").forEach(button => {
        button.addEventListener("click", () => {
            const column = button.dataset.sort;

            if (sortColumn === column) {
                sortDirection = sortDirection === "asc" ? "desc" : "asc";
            } else {
                sortColumn = column;
                sortDirection = "asc";
            }

            renderStudents();
        });
    });

    loadStudents();
</script>
</body>
</html>
