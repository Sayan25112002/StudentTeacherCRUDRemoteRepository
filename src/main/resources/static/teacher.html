<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #243047;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #263b80;
        }

        .card {
            background: white;
            padding: 24px;
            margin: 24px 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd2df;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            margin: 4px;
        }

        .primary {
            background: #3156c9;
        }

        .secondary {
            background: #667085;
        }

        .edit {
            background: #d99016;
        }

        .delete {
            background: #d63838;
        }

        .actions {
            margin-top: 18px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            white-space: nowrap;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e3e7ef;
            text-align: left;
        }

        th {
            background: #263b80;
            color: white;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .sort-button {
            background: transparent;
            color: white;
            font-weight: bold;
            font-size: inherit;
            font-family: inherit;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }

        .sort-button:hover {
            text-decoration: underline;
        }

        input.field-error,
        textarea.field-error {
            border: 1px solid red;
        }

        .field-error-message {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            font-weight: normal;
        }

        .field-error-message:empty {
            display: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Student Teacher Management System</h1>

    <section class="card">
        <h2 id="formTitle">Add Teacher</h2>
        <form id="teacherForm">
            <div class="form-grid">
                <div>
                    <label for="photo">Teacher Photo</label>
                    <input type="file" id="photo" accept="image/*" required>
                    <small id="photoError" class="field-error-message"></small>
                    <img id="photoPreview" alt="Current Teacher Photo" width="100" height="100"
                         style="display: none; object-fit: cover; margin-top: 10px;">
                </div>
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                    <small id="nameError" class="field-error-message"></small>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                    <small id="emailError" class="field-error-message"></small>
                </div>
                <div>
                    <label for="contactNo">Contact Number</label>
                    <input type="tel" id="contactNo" required>
                    <small id="contactNoError" class="field-error-message"></small>
                </div>
                <div id="passwordField">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                    <small id="passwordError" class="field-error-message"></small>
                </div>
                <div>
                    <label for="address">Address</label>
                    <textarea id="address" rows="3" required></textarea>
                    <small id="addressError" class="field-error-message"></small>
                </div>
                <div>
                    <label for="designation">Designation</label>
                    <input type="text" id="designation" required>
                    <small id="designationError" class="field-error-message"></small>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="primary" id="saveButton">Create Teacher</button>
                <button type="button" class="secondary" id="cancelButton" hidden>Cancel Edit</button>
            </div>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
        <h2>Teacher Records</h2>
        <div>
            <button type="button" class="primary" id="refreshButton">
                Refresh Records
            </button>
            <button type="button" class="primary" id="exportButton">
                Export
            </button>
            <button type="button" class="primary" id="importButton">
                Import
            </button>
            <button type="button" class="primary" id="exportMappedStudentsButton">
                Export Mapped Students
            </button>
            <input type="file" id="importFile" accept=".csv" hidden>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;">
            <select id="searchBy" style="width: auto; padding: 10px;">
                <option value="">All Fields</option>
                <option value="name">Name</option>
                <option value="email">Email</option>
                <option value="contactNo">Contact Number</option>
                <option value="address">Address</option>
                <option value="designation">Designation</option>
            </select>

            <input type="text" id="searchInput" placeholder="Search teachers..."
                   style="width: auto; flex: 1; min-width: 180px;">

            <select id="pageSize" style="width: auto; padding: 10px;">
                <option value="5">5 per page</option>
                <option value="10">10 per page</option>
                <option value="20">20 per page</option>
            </select>

            <button type="button" class="primary" id="searchButton">Search</button>
            <button type="button" class="secondary" id="clearSearchButton">Clear</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr>
                    <th>
                        <button type="button" class="sort-button" data-sort="serialId">
                            Serial ID ↕
                        </button>
                    </th>
                    <th>Photo</th>
                    <th><button type="button" class="sort-button" data-sort="name">Name ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="email">Email ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="contactNo">Contact Number ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="address">Address ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="designation">Designation ↕</button></th>
                    <th>Assigned Students</th><th>Actions</th>
                </tr></thead>
                <tbody id="teacherTable"></tbody>
            </table>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; margin-top: 15px;">
            <span id="pageInfo">Page 1</span>
            <div>
                <button type="button" class="secondary" id="previousButton">Previous</button>
                <button type="button" class="primary" id="nextButton">Next</button>
            </div>
        </div>
    </section>
</div>

<script>
    const API = {
        create: "http://localhost:8080/createTeacher",
        read: "http://localhost:8080/readTeacher",
        update: id => `http://localhost:8080/updateTeacher?id=${encodeURIComponent(id)}`,
        delete: id => `http://localhost:8080/deleteTeacher?id=${encodeURIComponent(id)}`,
        assign: "http://localhost:8080/mapStudentsToTeacher",
        import: "http://localhost:8080/importTeachers",
        export: "http://localhost:8080/exportTeachers",
        exportMappedStudents: "http://localhost:8080/exportMappedStudentsToTeacher",
        exportMappedStudentsToOneTeacher: id => `http://localhost:8080/exportMappedStudentsToOneTeacher?id=${encodeURIComponent(id)}`
    };

    const form = document.getElementById("teacherForm");
    const table = document.getElementById("teacherTable");
    const message = document.getElementById("message");

    let editingId = null;
    let editingPhotoPath = null;
    let allTeachers = [];
    let pageNumber = 1;
    let pageSize = 5;
    let sortColumn = "serialId";
    let sortDirection = "ASC";
    let searchBy = "";
    let search = "";


    async function request(url, options = {}) {
        const response = await fetch(url, options);
        if (response.status === 204) {
            if (!response.ok) {
                throw new Error("Request failed: " + response.status);
            }
            return null;
        }
        const contentType = response.headers.get("content-type") || "";
        let data = null;
        if (contentType.includes("application/json")) {
            data = await response.json();
        } else {
            data = await response.text();
        }
        if (!response.ok) {
            const errorMessage =
                typeof data === "object" && data !== null
                    ? data.message || JSON.stringify(data)
                    : data;
            throw new Error(errorMessage || `Request failed: ${response.status}`);
        }
        return data;
    }


    function showMessage(text) { message.textContent = text; }

    const fieldIds = [
        "photo", "name", "email", "contactNo",
        "password", "address", "designation"
    ];

    function clearFieldErrors() {
        fieldIds.forEach(id => {
            document.getElementById(id).classList.remove("field-error");
            document.getElementById(id + "Error").textContent = "";
        });
    }

    function showFieldError(fieldId, errorText) {
        const field = document.getElementById(fieldId);
        const errorElement = document.getElementById(fieldId + "Error");

        if (!field || !errorElement) return;

        field.classList.add("field-error");
        errorElement.textContent = errorText;
    }

    function showBackendError(errorText) {
        clearFieldErrors();

        const text = errorText.toLowerCase();

        if (text.includes("email")) {
            showFieldError("email", errorText);
        } else if (
            text.includes("contact") ||
            text.includes("phone") ||
            text.includes("mobile")
        ) {
            showFieldError("contactNo", errorText);
        } else if (text.includes("password")) {
            showFieldError("password", errorText);
        } else if (text.includes("photo") || text.includes("image")) {
            showFieldError("photo", errorText);
        } else if (text.includes("designation")) {
            showFieldError("designation", errorText);
        } else if (text.includes("address")) {
            showFieldError("address", errorText);
        } else if (text.includes("name")) {
            showFieldError("name", errorText);
        } else {
            showMessage("Operation failed: " + errorText);
        }
    }

    fieldIds.forEach(id => {
        document.getElementById(id).addEventListener("input", () => {
            document.getElementById(id).classList.remove("field-error");
            document.getElementById(id + "Error").textContent = "";
        });

        document.getElementById(id).addEventListener("change", () => {
            document.getElementById(id).classList.remove("field-error");
            document.getElementById(id + "Error").textContent = "";
        });
    });

    function getFormData() {
        return {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            contactNo: document.getElementById("contactNo").value.trim(),
            password: document.getElementById("password").value,
            address: document.getElementById("address").value.trim(),
            designation: document.getElementById("designation").value.trim()
        };
    }

    document.getElementById("photo").addEventListener("change", function () {
        const preview = document.getElementById("photoPreview");
        const photo = this.files[0];
        if (photo) {
            preview.src = URL.createObjectURL(photo);
            preview.style.display = "block";
        } else {
            preview.removeAttribute("src");
            preview.style.display = "none";
        }
    });

    let loadingTeachers = false;

    async function loadTeachers() {
        if (loadingTeachers) return;
        loadingTeachers = true;

        try {
            const params = new URLSearchParams({
                pageNumber: "1",
                pageSize: "10000",
                sortBy: "id",
                sortDir: "ASC"
            });

            if (searchBy) params.append("searchBy", searchBy);
            if (search) params.append("search", search);

            const data = await request(`${API.read}?${params.toString()}`);

            if (!Array.isArray(data)) {
                throw new Error("Expected a list of teachers from the API.");
            }

            // Sort fetched data by database ID ASC to establish permanent global Serial IDs (1, 2, 3...)
            data.sort((a, b) => a.id - b.id);
            allTeachers = data.map((teacher, index) => ({
                ...teacher,
                serialId: index + 1
            }));

            // Apply current sorting
            sortTeachersArray();

            renderTeachers();
            updatePagination();

        } catch (error) {
            showMessage("Could not load teachers: " + error.message);
        } finally {
            loadingTeachers = false;
        }
    }

    function sortTeachersArray() {
        allTeachers.sort((a, b) => {
            let valA = a[sortColumn];
            let valB = b[sortColumn];

            if (valA === undefined || valA === null) valA = "";
            if (valB === undefined || valB === null) valB = "";

            if (typeof valA === "string") {
                valA = valA.toLowerCase();
                valB = valB.toLowerCase();
            }

            if (valA < valB) return sortDirection === "ASC" ? -1 : 1;
            if (valA > valB) return sortDirection === "ASC" ? 1 : -1;
            return 0;
        });
    }

    function updateSortArrows() {
        document.querySelectorAll(".sort-button").forEach(button => {
            const column = button.dataset.sort;
            const name = button.textContent.replace(/[↑↓↕]/g, "").trim();

            button.textContent = name +
                (column === sortColumn
                    ? (sortDirection === "ASC" ? " ↑" : " ↓")
                    : " ↕");
        });
    }

    function getStudentNames(teacher) {
        if (!Array.isArray(teacher.students)) return "";
        return teacher.students.map(student => {
            const name = `${student.firstName ?? ""} ${student.lastName ?? ""}`.trim();
            return name || `ID ${student.id}`;
        }).join(", ");
    }

    function renderTeachers() {
        table.replaceChildren();

        const startIndex = (pageNumber - 1) * pageSize;
        const pageTeachers = allTeachers.slice(startIndex, startIndex + pageSize);

        if (pageTeachers.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 9;
            cell.textContent = "No teacher records found.";

            row.appendChild(cell);
            table.appendChild(row);

            updateSortArrows();
            return;
        }

        pageTeachers.forEach(teacher => {
            const row = document.createElement("tr");

            // Serial ID
            const serialCell = document.createElement("td");
            serialCell.textContent = teacher.serialId;
            row.appendChild(serialCell);

            // Teacher photo
            const photoCell = document.createElement("td");

            if (teacher.photoPath) {
                const fileName = teacher.photoPath.split(/[\\/]/).pop();
                const img = document.createElement("img");

                img.src =
                    `http://localhost:8080/images/${encodeURIComponent(fileName)}`;
                img.alt = "Teacher Photo";
                img.width = 60;
                img.height = 60;
                img.style.objectFit = "cover";
                img.style.borderRadius = "6px";

                photoCell.appendChild(img);
            } else {
                photoCell.textContent = "No photo";
            }

            row.appendChild(photoCell);

            // Teacher details and assigned students
            [
                teacher.name,
                teacher.email,
                teacher.contactNo,
                teacher.address,
                teacher.designation,
                getStudentNames(teacher)
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            // Action buttons
            const actions = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.className = "edit";
            editButton.addEventListener("click", () => editTeacher(teacher.id));

            const assignButton = document.createElement("button");
            assignButton.textContent = "Assign Students";
            assignButton.className = "primary";
            assignButton.addEventListener("click", () => {
                window.location.href =
                    `assignStudents.html?teacherId=${encodeURIComponent(teacher.id)}`;
            });

            actions.append(editButton, assignButton);

            if (Array.isArray(teacher.students) && teacher.students.length > 0) {
                const exportMappedButton = document.createElement("button");
                exportMappedButton.textContent = "Export Mapped Students";
                exportMappedButton.className = "primary";
                exportMappedButton.addEventListener("click", () =>
                    exportMappedStudentsToOneTeacher(teacher.id)
                );

                actions.appendChild(exportMappedButton);
            }

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";
            deleteButton.addEventListener("click", () => deleteTeacher(teacher.id));

            actions.appendChild(deleteButton);
            row.appendChild(actions);
            table.appendChild(row);
        });

        updateSortArrows();
    }

    function updatePagination() {
        const startIndex = (pageNumber - 1) * pageSize;
        const hasNextPage = startIndex + pageSize < allTeachers.length;

        document.getElementById("pageInfo").textContent = `Page ${pageNumber}`;
        document.getElementById("previousButton").disabled = pageNumber <= 1;
        document.getElementById("nextButton").disabled = !hasNextPage;
    }

    async function getExistingPhotoFile(photoPath) {
        const fileName = photoPath.split(/[\\/]/).pop();
        const response = await fetch(`http://localhost:8080/images/${encodeURIComponent(fileName)}`);
        if (!response.ok) throw new Error("Could not load the existing photo.");
        const blob = await response.blob();
        return new File([blob], fileName, { type: blob.type || "image/jpeg" });
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();
        clearFieldErrors();
        showMessage("");
        const teacher = getFormData();
        const photo = document.getElementById("photo").files[0];
        const isEditing = editingId !== null;
        const formData = new FormData();

        Object.entries(teacher).forEach(([key, value]) => {
            if (key === "password" && isEditing) return;
            formData.append(key, value);
        });
        try {
            if (photo) {
                formData.append("photo", photo);
            } else if (isEditing && editingPhotoPath) {
                formData.append("photo", await getExistingPhotoFile(editingPhotoPath));
                formData.append("photoPath", editingPhotoPath);
            }
            const response = await request(
                isEditing ? API.update(editingId) : API.create,
                {
                    method: isEditing ? "PUT" : "POST",
                    body: formData
                }
            );
            alert(
                response && typeof response === "object" && response.message
                    ? response.message
                    : isEditing
                        ? "Teacher updated successfully."
                        : "Teacher created successfully."
            );
            resetForm();
            await loadTeachers();
        } catch (error) {
            alert(error.message);
            showBackendError(error.message);
        }
    });

    function editTeacher(id) {
        const teacher = allTeachers.find(item => String(item.id) === String(id));
        if (!teacher) { showMessage("Teacher record not found."); return; }
        editingId = id;
        editingPhotoPath = teacher.photoPath ?? null;
        document.getElementById("photo").value = "";
        const preview = document.getElementById("photoPreview");
        if (teacher.photoPath) {
            const fileName = teacher.photoPath.split(/[\\/]/).pop();
            preview.src = `http://localhost:8080/images/${encodeURIComponent(fileName)}`;
            preview.style.display = "block";
        } else {
            preview.removeAttribute("src"); preview.style.display = "none";
        }
        document.getElementById("name").value = teacher.name ?? "";
        document.getElementById("email").value = teacher.email ?? "";
        document.getElementById("contactNo").value = teacher.contactNo ?? "";
        document.getElementById("password").value = "";
        document.getElementById("address").value = teacher.address ?? "";
        document.getElementById("designation").value = teacher.designation ?? "";
        document.getElementById("password").required = false;
        document.getElementById("passwordField").style.display = "none";
        document.getElementById("photo").required = false;
        document.getElementById("formTitle").textContent = "Update Teacher";
        document.getElementById("saveButton").textContent = "Update Teacher";
        document.getElementById("cancelButton").hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function exportMappedStudentsToOneTeacher(id) {
        try {
            const response = await fetch(API.exportMappedStudentsToOneTeacher(id));

            if (!response.ok) {
                throw new Error("Failed to export mapped students.");
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download = `Mapped Students Teacher ${id}.csv`;

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);
        } catch (error) {
            alert(error.message);
        }
    }

    async function deleteTeacher(id) {
        if (!confirm("Are you sure you want to delete this teacher?")) return;
        try {
            const response = await request(API.delete(id), {
                method: "DELETE"
            });
            alert(
                response && typeof response === "object" && response.message
                    ? response.message
                    : "Teacher deleted successfully."
            );
            if (String(editingId) === String(id)) {
                resetForm();
            }
            await loadTeachers();
        } catch (error) {
            alert(error.message);
            showBackendError(error.message);
        }
    }

    function resetForm() {
        form.reset();
        editingId = null;
        editingPhotoPath = null;
        document.getElementById("password").required = true;
        document.getElementById("passwordField").style.display = "";
        document.getElementById("photo").required = true;
        document.getElementById("formTitle").textContent = "Add Teacher";
        document.getElementById("saveButton").textContent = "Create Teacher";
        document.getElementById("cancelButton").hidden = true;
        document.getElementById("photo").value = "";
        const preview = document.getElementById("photoPreview");
        preview.removeAttribute("src"); preview.style.display = "none";
    }

    document.getElementById("cancelButton").addEventListener("click", resetForm);
    document.getElementById("refreshButton").addEventListener("click", loadTeachers);

    document.getElementById("exportButton")
        .addEventListener("click", async () => {
            try {
                const response = await fetch(API.export);
                if (!response.ok) {
                    throw new Error("Failed to export teachers.");
                }
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                const disposition = response.headers.get("Content-Disposition");
                const match = disposition?.match(/filename="?([^"]+)"?/);
                link.href = url;
                link.download = match ? match[1] : "List of Teachers.csv";
                link.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                alert(error.message);
            }
        });

    document.getElementById("exportMappedStudentsButton")
        .addEventListener("click", async () => {
            try {
                const response = await fetch(API.exportMappedStudents);
                if (!response.ok) {
                    throw new Error("Failed to export mapped students.");
                }
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                const disposition = response.headers.get("Content-Disposition");
                const match = disposition?.match(/filename="?([^"]+)"?/);
                link.href = url;
                link.download = match
                    ? match[1]
                    : "List of Mapped Students To Teacher.csv";
                link.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                alert(error.message);
            }
        });

    document.getElementById("importButton")
        .addEventListener("click", () => {
            document.getElementById("importFile").click();
        });

    document.getElementById("importFile")
        .addEventListener("change", async function () {
            const file = this.files[0];

            if (!file) {
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            try {
                const result = await request(API.import, {
                    method: "POST",
                    body: formData
                });

                alert(typeof result === "string"
                    ? result
                    : result?.message ?? "Import completed.");

                pageNumber = 1;
                await loadTeachers();
            } catch (error) {
                alert("Import failed: " + error.message);
            } finally {
                this.value = "";
            }
        });

    document.querySelectorAll(".sort-button").forEach(button => {
        button.addEventListener("click", () => {
            const column = button.dataset.sort;

            if (sortColumn === column) {
                sortDirection = sortDirection === "ASC" ? "DESC" : "ASC";
            } else {
                sortColumn = column;
                sortDirection = "ASC";
            }

            pageNumber = 1;
            sortTeachersArray();
            renderTeachers();
            updatePagination();
        });
    });

    document.getElementById("searchButton").addEventListener("click", async () => {
        searchBy = document.getElementById("searchBy").value;
        search = document.getElementById("searchInput").value.trim();
        pageNumber = 1;
        await loadTeachers();
    });

    document.getElementById("searchInput").addEventListener("keydown", async event => {
        if (event.key === "Enter") {
            event.preventDefault();
            searchBy = document.getElementById("searchBy").value;
            search = document.getElementById("searchInput").value.trim();
            pageNumber = 1;
            await loadTeachers();
        }
    });

    document.getElementById("clearSearchButton").addEventListener("click", async () => {
        document.getElementById("searchBy").value = "";
        document.getElementById("searchInput").value = "";

        searchBy = "";
        search = "";
        pageNumber = 1;

        await loadTeachers();
    });

    document.getElementById("pageSize").addEventListener("change", event => {
        pageSize = Number(event.target.value);
        pageNumber = 1;
        renderTeachers();
        updatePagination();
    });

    document.getElementById("previousButton").addEventListener("click", () => {
        if (pageNumber > 1) {
            pageNumber--;
            renderTeachers();
            updatePagination();
        }
    });

    document.getElementById("nextButton").addEventListener("click", () => {
        const startIndex = (pageNumber - 1) * pageSize;
        if (startIndex + pageSize < allTeachers.length) {
            pageNumber++;
            renderTeachers();
            updatePagination();
        }
    });

    loadTeachers();
</script>
</body>
</html>
