<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #243047;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #263b80;
        }

        .card {
            background: white;
            padding: 24px;
            margin: 24px 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd2df;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            margin: 4px;
        }

        .primary {
            background: #3156c9;
        }

        .secondary {
            background: #667085;
        }

        .edit {
            background: #d99016;
        }

        .delete {
            background: #d63838;
        }

        .actions {
            margin-top: 18px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            white-space: nowrap;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e3e7ef;
            text-align: left;
        }

        th {
            background: #263b80;
            color: white;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .sort-button {
            background: transparent;
            color: white;
            font-weight: bold;
            font-size: inherit;
            font-family: inherit;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }

        .sort-button:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Student Teacher Management System</h1>

    <section class="card">
        <h2 id="formTitle">Add Teacher</h2>
        <form id="teacherForm">
            <div class="form-grid">
                <div>
                    <label for="photo">Teacher Photo</label>
                    <input type="file" id="photo" accept="image/*" required>
                    <img id="photoPreview" alt="Current Teacher Photo" width="100" height="100"
                         style="display: none; object-fit: cover; margin-top: 10px;">
                </div>
                <div><label for="name">Name</label><input type="text" id="name" required></div>
                <div><label for="email">Email</label><input type="email" id="email" required></div>
                <div><label for="contactNo">Contact Number</label><input type="tel" id="contactNo" required></div>
                <div id="passwordField"><label for="password">Password</label><input type="password" id="password" required></div>
                <div><label for="address">Address</label><textarea id="address" rows="3" required></textarea></div>
                <div><label for="designation">Designation</label><input type="text" id="designation" required></div>
            </div>
            <div class="actions">
                <button type="submit" class="primary" id="saveButton">Create Teacher</button>
                <button type="button" class="secondary" id="cancelButton" hidden>Cancel Edit</button>
            </div>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
        <h2>Teacher Records</h2>
        <button type="button" class="primary" id="refreshButton">Refresh Records</button>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;">
            <select id="searchBy" style="width: auto; padding: 10px;">
                <option value="">All Fields</option>
                <option value="name">Name</option>
                <option value="email">Email</option>
                <option value="contactNo">Contact Number</option>
                <option value="address">Address</option>
                <option value="designation">Designation</option>
            </select>

            <input type="text" id="searchInput" placeholder="Search teachers..."
                   style="width: auto; flex: 1; min-width: 180px;">

            <select id="pageSize" style="width: auto; padding: 10px;">
                <option value="5">5 per page</option>
                <option value="10">10 per page</option>
                <option value="20">20 per page</option>
            </select>

            <button type="button" class="primary" id="searchButton">Search</button>
            <button type="button" class="secondary" id="clearSearchButton">Clear</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr>
                    <th>
                        <button type="button" class="sort-button" data-sort="serialId">
                            Serial ID ↕
                        </button>
                    </th>
                    <th>Photo</th>
                    <th><button type="button" class="sort-button" data-sort="name">Name ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="email">Email ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="contactNo">Contact Number ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="address">Address ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="designation">Designation ↕</button></th>
                    <th>Assigned Students</th><th>Actions</th>
                </tr></thead>
                <tbody id="teacherTable"></tbody>
            </table>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; margin-top: 15px;">
            <span id="pageInfo">Page 1</span>
            <div>
                <button type="button" class="secondary" id="previousButton">Previous</button>
                <button type="button" class="primary" id="nextButton">Next</button>
            </div>
        </div>
    </section>
</div>

<script>
    const API = {
        create: "http://localhost:8080/createTeacher",
        read: "http://localhost:8080/readTeacher",
        update: id => `http://localhost:8080/updateTeacher?id=${encodeURIComponent(id)}`,
        delete: id => `http://localhost:8080/deleteTeacher?id=${encodeURIComponent(id)}`,
        assign: "http://localhost:8080/mapStudentsToTeacher"
    };

    const form = document.getElementById("teacherForm");
    const table = document.getElementById("teacherTable");
    const message = document.getElementById("message");

    let editingId = null;
    let editingPhotoPath = null;
    let teachers = [];
    let pageNumber = 1;
    let pageSize = 5;
    let sortColumn = "serialId";
    let sortDirection = "ASC";
    let searchBy = "";
    let search = "";
    let hasNextPage = false;

    // Frontend Serial ID Management
    const teacherSerialMap = new Map();
    let nextSerialId = 1;

    async function request(url, options = {}) {
        const response = await fetch(url, options);
        if (!response.ok) {
            const details = await response.text();
            throw new Error(details || `Request failed: ${response.status}`);
        }
        if (response.status === 204) return null;
        const contentType = response.headers.get("content-type") || "";
        return contentType.includes("application/json") ? response.json() : null;
    }

    function showMessage(text) { message.textContent = text; }

    function getFormData() {
        return {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            contactNo: document.getElementById("contactNo").value.trim(),
            password: document.getElementById("password").value,
            address: document.getElementById("address").value.trim(),
            designation: document.getElementById("designation").value.trim()
        };
    }

    document.getElementById("photo").addEventListener("change", function () {
        const preview = document.getElementById("photoPreview");
        const photo = this.files[0];
        if (photo) {
            preview.src = URL.createObjectURL(photo);
            preview.style.display = "block";
        } else {
            preview.removeAttribute("src");
            preview.style.display = "none";
        }
    });

    let loadingTeachers = false;

    async function loadTeachers() {
        if (loadingTeachers) return;

        loadingTeachers = true;

        try {
            // If sorting by serialId, query backend by database 'id' as baseline order
            const backendSortBy = sortColumn === "serialId" ? "id" : sortColumn;
            const backendSortDir = sortColumn === "serialId" ? "ASC" : sortDirection;

            const params = new URLSearchParams({
                pageNumber: pageNumber,
                pageSize: pageSize,
                sortBy: backendSortBy,
                sortDir: backendSortDir
            });

            if (searchBy) params.append("searchBy", searchBy);
            if (search) params.append("search", search);

            const data = await request(`${API.read}?${params.toString()}`);

            if (!Array.isArray(data)) {
                throw new Error("Expected a list of teachers from the API.");
            }

            // Assign or retrieve persistent frontend serial ID for each teacher
            teachers = data.map(teacher => {
                if (!teacherSerialMap.has(teacher.id)) {
                    teacherSerialMap.set(teacher.id, nextSerialId++);
                }
                return {
                    ...teacher,
                    serialId: teacherSerialMap.get(teacher.id)
                };
            });

            // If sorting by serialId, sort the current teachers array locally on frontend
            if (sortColumn === "serialId") {
                teachers.sort((a, b) => {
                    return sortDirection === "ASC" ? a.serialId - b.serialId : b.serialId - a.serialId;
                });
            }

            hasNextPage = data.length === pageSize;

            renderTeachers();

            document.getElementById("pageInfo").textContent =
                `Page ${pageNumber}`;

            document.getElementById("previousButton").disabled =
                pageNumber === 1;

            document.getElementById("nextButton").disabled =
                !hasNextPage;

        } catch (error) {
            showMessage("Could not load teachers: " + error.message);
        } finally {
            loadingTeachers = false;
        }
    }

    function updateSortArrows() {
        document.querySelectorAll(".sort-button").forEach(button => {
            const column = button.dataset.sort;
            const name = button.textContent.replace(/[↑↓↕]/g, "").trim();

            button.textContent = name +
                (column === sortColumn
                    ? (sortDirection === "ASC" ? " ↑" : " ↓")
                    : " ↕");
        });
    }

    function getStudentNames(teacher) {
        if (!Array.isArray(teacher.students)) return "";
        return teacher.students.map(student => {
            const name = `${student.firstName ?? ""} ${student.lastName ?? ""}`.trim();
            return name || `ID ${student.id}`;
        }).join(", ");
    }

    function renderTeachers() {
        table.replaceChildren();

        if (teachers.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 9;
            cell.textContent = "No teacher records found.";

            row.appendChild(cell);
            table.appendChild(row);

            updateSortArrows();
            return;
        }

        teachers.forEach(teacher => {
            const row = document.createElement("tr");

            // Display persistent frontend-generated Serial ID
            const serialCell = document.createElement("td");
            serialCell.textContent = teacher.serialId ?? "";
            row.appendChild(serialCell);

            // Teacher photo
            const photoCell = document.createElement("td");

            if (teacher.photoPath) {
                const fileName = teacher.photoPath.split(/[\\/]/).pop();
                const img = document.createElement("img");

                img.src =
                    `http://localhost:8080/images/${encodeURIComponent(fileName)}`;
                img.alt = "Teacher Photo";
                img.width = 60;
                img.height = 60;
                img.style.objectFit = "cover";
                img.style.borderRadius = "6px";

                photoCell.appendChild(img);
            } else {
                photoCell.textContent = "No photo";
            }

            row.appendChild(photoCell);

            // Teacher details and assigned students
            [
                teacher.name,
                teacher.email,
                teacher.contactNo,
                teacher.address,
                teacher.designation,
                getStudentNames(teacher)
            ].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            // Action buttons
            const actions = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.className = "edit";
            editButton.addEventListener("click", () => editTeacher(teacher.id));

            const assignButton = document.createElement("button");
            assignButton.textContent = "Assign Students";
            assignButton.className = "primary";
            assignButton.addEventListener("click", () => {
                window.location.href =
                    `assignStudents.html?teacherId=${encodeURIComponent(teacher.id)}`;
            });

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";
            deleteButton.addEventListener("click", () => deleteTeacher(teacher.id));

            actions.append(editButton, assignButton, deleteButton);
            row.appendChild(actions);

            table.appendChild(row);
        });

        updateSortArrows();
    }

    async function getExistingPhotoFile(photoPath) {
        const fileName = photoPath.split(/[\\/]/).pop();
        const response = await fetch(`http://localhost:8080/images/${encodeURIComponent(fileName)}`);
        if (!response.ok) throw new Error("Could not load the existing photo.");
        const blob = await response.blob();
        return new File([blob], fileName, { type: blob.type || "image/jpeg" });
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();
        const teacher = getFormData();
        const photo = document.getElementById("photo").files[0];
        const isEditing = editingId !== null;
        const formData = new FormData();

        Object.entries(teacher).forEach(([key, value]) => {
            // Password is required on create and omitted from update requests.
            if (key === "password" && isEditing) return;
            formData.append(key, value);
        });

        try {
            if (photo) {
                formData.append("photo", photo);
            } else if (isEditing && editingPhotoPath) {
                formData.append("photo", await getExistingPhotoFile(editingPhotoPath));
                formData.append("photoPath", editingPhotoPath);
            }
            await request(isEditing ? API.update(editingId) : API.create, {
                method: isEditing ? "PUT" : "POST",
                body: formData
            });
            resetForm();
            await loadTeachers();
            showMessage(isEditing ? "Teacher updated successfully." : "Teacher created successfully.");
        } catch (error) {
            showMessage("Operation failed: " + error.message);
        }
    });

    function editTeacher(id) {
        const teacher = teachers.find(item => String(item.id) === String(id));
        if (!teacher) { showMessage("Teacher record not found."); return; }
        editingId = id;
        editingPhotoPath = teacher.photoPath ?? null;
        document.getElementById("photo").value = "";
        const preview = document.getElementById("photoPreview");
        if (teacher.photoPath) {
            const fileName = teacher.photoPath.split(/[\\/]/).pop();
            preview.src = `http://localhost:8080/images/${encodeURIComponent(fileName)}`;
            preview.style.display = "block";
        } else {
            preview.removeAttribute("src"); preview.style.display = "none";
        }
        document.getElementById("name").value = teacher.name ?? "";
        document.getElementById("email").value = teacher.email ?? "";
        document.getElementById("contactNo").value = teacher.contactNo ?? "";
        document.getElementById("password").value = "";
        document.getElementById("address").value = teacher.address ?? "";
        document.getElementById("designation").value = teacher.designation ?? "";
        document.getElementById("password").required = false;
        document.getElementById("passwordField").style.display = "none";
        document.getElementById("photo").required = false;
        document.getElementById("formTitle").textContent = "Update Teacher";
        document.getElementById("saveButton").textContent = "Update Teacher";
        document.getElementById("cancelButton").hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteTeacher(id) {
        if (!confirm("Are you sure you want to delete this teacher?")) return;
        try {
            await request(API.delete(id), { method: "DELETE" });
            if (String(editingId) === String(id)) resetForm();
            await loadTeachers();
            showMessage("Teacher deleted successfully.");
        } catch (error) {
            showMessage("Delete failed: " + error.message);
        }
    }

    function resetForm() {
        form.reset();
        editingId = null;
        editingPhotoPath = null;
        document.getElementById("password").required = true;
        document.getElementById("passwordField").style.display = "";
        document.getElementById("photo").required = true;
        document.getElementById("formTitle").textContent = "Add Teacher";
        document.getElementById("saveButton").textContent = "Create Teacher";
        document.getElementById("cancelButton").hidden = true;
        document.getElementById("photo").value = "";
        const preview = document.getElementById("photoPreview");
        preview.removeAttribute("src"); preview.style.display = "none";
    }

    document.getElementById("cancelButton").addEventListener("click", resetForm);
    document.getElementById("refreshButton").addEventListener("click", loadTeachers);
    let sortingInProgress = false;

    document.querySelectorAll(".sort-button").forEach(button => {
        button.addEventListener("click", async () => {
            if (sortingInProgress) return;

            sortingInProgress = true;

            try {
                const column = button.dataset.sort;

                if (sortColumn === column) {
                    sortDirection = sortDirection === "ASC" ? "DESC" : "ASC";
                } else {
                    sortColumn = column;
                    sortDirection = "ASC";
                }

                pageNumber = 1;

                await loadTeachers();
            } finally {
                sortingInProgress = false;
            }
        });
    });

    document.getElementById("searchButton").addEventListener("click", async () => {
        searchBy = document.getElementById("searchBy").value;
        search = document.getElementById("searchInput").value.trim();
        pageNumber = 1;
        await loadTeachers();
    });

    document.getElementById("searchInput").addEventListener("keydown", async event => {
        if (event.key === "Enter") {
            event.preventDefault();
            searchBy = document.getElementById("searchBy").value;
            search = document.getElementById("searchInput").value.trim();
            pageNumber = 1;
            await loadTeachers();
        }
    });

    document.getElementById("clearSearchButton").addEventListener("click", async () => {
        document.getElementById("searchBy").value = "";
        document.getElementById("searchInput").value = "";

        searchBy = "";
        search = "";
        pageNumber = 1;

        await loadTeachers();
    });

    document.getElementById("pageSize").addEventListener("change", async event => {
        pageSize = Number(event.target.value);
        pageNumber = 1;
        await loadTeachers();
    });

    document.getElementById("previousButton").addEventListener("click", async () => {
        if (pageNumber > 1) {
            pageNumber--;
            await loadTeachers();
        }
    });

    document.getElementById("nextButton").addEventListener("click", async () => {
        if (hasNextPage) {
            pageNumber++;
            await loadTeachers();
        }
    });
    loadTeachers();
</script>
</body>
</html>
