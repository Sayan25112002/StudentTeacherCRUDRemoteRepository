<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #243047;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #263b80;
        }

        .card {
            background: white;
            padding: 24px;
            margin: 24px 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd2df;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            margin: 4px;
        }

        .primary {
            background: #3156c9;
        }

        .secondary {
            background: #667085;
        }

        .edit {
            background: #d99016;
        }

        .delete {
            background: #d63838;
        }

        .actions {
            margin-top: 18px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            white-space: nowrap;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e3e7ef;
            text-align: left;
        }

        th {
            background: #263b80;
            color: white;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .sort-button {
            background: transparent;
            color: white;
            font-weight: bold;
            font-size: inherit;
            font-family: inherit;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }

        .sort-button:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Student Teacher Management System</h1>

    <section class="card">
        <h2 id="formTitle">Add Teacher</h2>
        <form id="teacherForm">
            <div class="form-grid">
                <div>
                    <label for="photo">Teacher Photo</label>
                    <input type="file" id="photo" accept="image/*" required>
                    <img id="photoPreview" alt="Current Teacher Photo" width="100" height="100"
                         style="display: none; object-fit: cover; margin-top: 10px;">
                </div>
                <div><label for="name">Name</label><input type="text" id="name" required></div>
                <div><label for="email">Email</label><input type="email" id="email" required></div>
                <div><label for="contactNo">Contact Number</label><input type="tel" id="contactNo" required></div>
                <div id="passwordField"><label for="password">Password</label><input type="password" id="password" required></div>
                <div><label for="address">Address</label><textarea id="address" rows="3" required></textarea></div>
                <div><label for="designation">Designation</label><input type="text" id="designation" required></div>
            </div>
            <div class="actions">
                <button type="submit" class="primary" id="saveButton">Create Teacher</button>
                <button type="button" class="secondary" id="cancelButton" hidden>Cancel Edit</button>
            </div>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
        <h2>Teacher Records</h2>
        <button type="button" class="primary" id="refreshButton">Refresh Records</button>
        <div class="table-wrapper">
            <table>
                <thead><tr>
                    <th><button type="button" class="sort-button" data-sort="serial">Serial ID ↕</button></th>
                    <th>Photo</th>
                    <th><button type="button" class="sort-button" data-sort="name">Name ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="email">Email ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="contactNo">Contact Number ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="address">Address ↕</button></th>
                    <th><button type="button" class="sort-button" data-sort="designation">Designation ↕</button></th>
                    <th>Assigned Students</th><th>Actions</th>
                </tr></thead>
                <tbody id="teacherTable"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
    const API = {
        create: "http://localhost:8080/createTeacher",
        read: "http://localhost:8080/readTeacher",
        update: id => `http://localhost:8080/updateTeacher?id=${encodeURIComponent(id)}`,
        delete: id => `http://localhost:8080/deleteTeacher?id=${encodeURIComponent(id)}`,
        assign: "http://localhost:8080/mapStudentsToTeacher"
    };

    const form = document.getElementById("teacherForm");
    const table = document.getElementById("teacherTable");
    const message = document.getElementById("message");
    let editingId = null;
    let editingPhotoPath = null;
    let teachers = [];
    let sortColumn = "serial";
    let sortDirection = "asc";

    async function request(url, options = {}) {
        const response = await fetch(url, options);
        if (!response.ok) {
            const details = await response.text();
            throw new Error(details || `Request failed: ${response.status}`);
        }
        if (response.status === 204) return null;
        const contentType = response.headers.get("content-type") || "";
        return contentType.includes("application/json") ? response.json() : null;
    }

    function showMessage(text) { message.textContent = text; }

    function getFormData() {
        return {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            contactNo: document.getElementById("contactNo").value.trim(),
            password: document.getElementById("password").value,
            address: document.getElementById("address").value.trim(),
            designation: document.getElementById("designation").value.trim()
        };
    }

    document.getElementById("photo").addEventListener("change", function () {
        const preview = document.getElementById("photoPreview");
        const photo = this.files[0];
        if (photo) {
            preview.src = URL.createObjectURL(photo);
            preview.style.display = "block";
        } else {
            preview.removeAttribute("src");
            preview.style.display = "none";
        }
    });

    async function loadTeachers() {
        try {
            const data = await request(API.read);
            if (!Array.isArray(data)) throw new Error("Expected a list of teachers from the API.");
            teachers = data;
            renderTeachers();
        } catch (error) {
            showMessage("Could not load teachers: " + error.message);
        }
    }

    function updateSortArrows() {
        document.querySelectorAll(".sort-button").forEach(button => {
            const column = button.dataset.sort;
            const name = button.textContent.replace(/[↑↓↕]/g, "").trim();
            button.textContent = name + (column === sortColumn ? (sortDirection === "asc" ? " ↑" : " ↓") : " ↕");
        });
    }

    function getStudentNames(teacher) {
        if (!Array.isArray(teacher.students)) return "";
        return teacher.students.map(student => {
            const name = `${student.firstName ?? ""} ${student.lastName ?? ""}`.trim();
            return name || `ID ${student.id}`;
        }).join(", ");
    }

    function renderTeachers() {
        table.replaceChildren();
        const sorted = [...teachers].sort((a, b) => {
            let result;

            if (sortColumn === "serial") {
                result = teachers.indexOf(a) - teachers.indexOf(b);
            } else {
                const aValue = a[sortColumn] ?? "";
                const bValue = b[sortColumn] ?? "";

                result = String(aValue).localeCompare(
                    String(bValue),
                    undefined,
                    { numeric: true, sensitivity: "base" }
                );
            }

            return sortDirection === "asc" ? result : -result;
        });

        if (sorted.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.colSpan = 9;
            cell.textContent = "No teacher records found.";
            row.appendChild(cell);
            table.appendChild(row);
            updateSortArrows();
            return;
        }

        sorted.forEach(teacher => {
            const row = document.createElement("tr");
            const serialCell = document.createElement("td");
            serialCell.textContent = teachers.indexOf(teacher) + 1;
            row.appendChild(serialCell);

            const photoCell = document.createElement("td");
            if (teacher.photoPath) {
                const fileName = teacher.photoPath.split(/[\\/]/).pop();
                const img = document.createElement("img");
                img.src = `http://localhost:8080/images/${encodeURIComponent(fileName)}`;
                img.alt = "Teacher Photo";
                img.width = 60; img.height = 60;
                img.style.objectFit = "cover"; img.style.borderRadius = "6px";
                photoCell.appendChild(img);
            } else photoCell.textContent = "No photo";
            row.appendChild(photoCell);

            [teacher.name, teacher.email, teacher.contactNo, teacher.address, teacher.designation, getStudentNames(teacher)].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            const actions = document.createElement("td");
            const editButton = document.createElement("button");
            editButton.textContent = "Edit"; editButton.className = "edit";
            editButton.addEventListener("click", () => editTeacher(teacher.id));
            const assignButton = document.createElement("button");
            assignButton.textContent = "Assign Students"; assignButton.className = "assign";
            assignButton.addEventListener("click", () => {
                window.location.href = `assignStudents.html?teacherId=${encodeURIComponent(teacher.id)}`;
            });
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete"; deleteButton.className = "delete";
            deleteButton.addEventListener("click", () => deleteTeacher(teacher.id));
            actions.append(editButton, assignButton, deleteButton);
            row.appendChild(actions);
            table.appendChild(row);
        });
        updateSortArrows();
    }

    async function getExistingPhotoFile(photoPath) {
        const fileName = photoPath.split(/[\\/]/).pop();
        const response = await fetch(`http://localhost:8080/images/${encodeURIComponent(fileName)}`);
        if (!response.ok) throw new Error("Could not load the existing photo.");
        const blob = await response.blob();
        return new File([blob], fileName, { type: blob.type || "image/jpeg" });
    }

    form.addEventListener("submit", async event => {
        event.preventDefault();
        const teacher = getFormData();
        const photo = document.getElementById("photo").files[0];
        const isEditing = editingId !== null;
        const formData = new FormData();

        Object.entries(teacher).forEach(([key, value]) => {
            // Password is required on create and omitted from update requests.
            if (key === "password" && isEditing) return;
            formData.append(key, value);
        });

        try {
            if (photo) {
                formData.append("photo", photo);
            } else if (isEditing && editingPhotoPath) {
                formData.append("photo", await getExistingPhotoFile(editingPhotoPath));
                formData.append("photoPath", editingPhotoPath);
            }
            await request(isEditing ? API.update(editingId) : API.create, {
                method: isEditing ? "PUT" : "POST",
                body: formData
            });
            resetForm();
            await loadTeachers();
            showMessage(isEditing ? "Teacher updated successfully." : "Teacher created successfully.");
        } catch (error) {
            showMessage("Operation failed: " + error.message);
        }
    });

    function editTeacher(id) {
        const teacher = teachers.find(item => String(item.id) === String(id));
        if (!teacher) { showMessage("Teacher record not found."); return; }
        editingId = id;
        editingPhotoPath = teacher.photoPath ?? null;
        document.getElementById("photo").value = "";
        const preview = document.getElementById("photoPreview");
        if (teacher.photoPath) {
            const fileName = teacher.photoPath.split(/[\\/]/).pop();
            preview.src = `http://localhost:8080/images/${encodeURIComponent(fileName)}`;
            preview.style.display = "block";
        } else {
            preview.removeAttribute("src"); preview.style.display = "none";
        }
        document.getElementById("name").value = teacher.name ?? "";
        document.getElementById("email").value = teacher.email ?? "";
        document.getElementById("contactNo").value = teacher.contactNo ?? "";
        document.getElementById("password").value = "";
        document.getElementById("address").value = teacher.address ?? "";
        document.getElementById("designation").value = teacher.designation ?? "";
        document.getElementById("password").required = false;
        document.getElementById("passwordField").style.display = "none";
        document.getElementById("photo").required = false;
        document.getElementById("formTitle").textContent = "Update Teacher";
        document.getElementById("saveButton").textContent = "Update Teacher";
        document.getElementById("cancelButton").hidden = false;
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteTeacher(id) {
        if (!confirm("Are you sure you want to delete this teacher?")) return;
        try {
            await request(API.delete(id), { method: "DELETE" });
            if (String(editingId) === String(id)) resetForm();
            await loadTeachers();
            showMessage("Teacher deleted successfully.");
        } catch (error) {
            showMessage("Delete failed: " + error.message);
        }
    }

    function resetForm() {
        form.reset();
        editingId = null;
        editingPhotoPath = null;
        document.getElementById("password").required = true;
        document.getElementById("passwordField").style.display = "";
        document.getElementById("photo").required = true;
        document.getElementById("formTitle").textContent = "Add Teacher";
        document.getElementById("saveButton").textContent = "Create Teacher";
        document.getElementById("cancelButton").hidden = true;
        document.getElementById("photo").value = "";
        const preview = document.getElementById("photoPreview");
        preview.removeAttribute("src"); preview.style.display = "none";
    }

    document.getElementById("cancelButton").addEventListener("click", resetForm);
    document.getElementById("refreshButton").addEventListener("click", loadTeachers);
    document.querySelectorAll(".sort-button").forEach(button => {
        button.addEventListener("click", () => {
            const column = button.dataset.sort;
            if (sortColumn === column) sortDirection = sortDirection === "asc" ? "desc" : "asc";
            else { sortColumn = column; sortDirection = "asc"; }
            renderTeachers();
        });
    });
    loadTeachers();
</script>
</body>
</html>
